# Goals for the daily plan and the weekly report (python -m planning.week, .\week.ps1).
# Copy to data/planning/goals.yaml (in the vault) and adapt. The keys are the ones you write in the plan
# file, e.g. "G1 = 45" under the day's balance.
#
# kind:       hours (mean per day), minutes (sum per week), count (sum per week),
#             yesno (days with "yes"), scale (-5..+5, mean)
# weekly_min: the weekly figure must reach at least this
# daily_max:  stages for a daily mean that should fall over time; the first stage whose "until" has not
#             passed applies
metrics:
  G1:
    title: "Half marathon under 2 hours: running minutes"
    kind: minutes
    weekly_min: 180
  G2:
    title: "Coaching licence: did something for it today"
    kind: yesno
    weekly_min: 2
  G3:
    title: "Hours spent brooding over a bad session"
    kind: hours
    daily_max:
      - {until: 2026-12-31, max: 2}
      - {until: 2027-06-30, max: 1}
      - {until: 2027-12-31, max: 0.5}
  Caught:
    title: "Brooding noticed and stopped"
    kind: count
  Mood:
    title: "Mood"
    kind: scale

# Lines "Key: text" that are shown in the report as notes (private, screen only).
notes: [Pain, Lesson]

# Dates to check; the report lists those due in the next 31 days and the overdue ones. Set done: true.
milestones:
  - {date: 2027-01-31, goal: G2, title: "Registration for the coaching course sent"}
  - {date: 2027-04-30, goal: G1, title: "10 km race under 55 minutes"}
  - {date: 2027-10-15, goal: G1, title: "Half marathon race"}

[project]
name = "document-analyzer"
version = "0.1.0"
description = "Private, fully local, agentic analyzer for personal training diaries"
requires-python = ">=3.11"
dependencies = [
    "odfpy>=1.4",
    "pyyaml>=6",
    "cryptography>=42",
    "argon2-cffi>=23",
    "pydantic>=2.7",
    "matplotlib>=3.9",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cloud = ["anthropic>=1.0"]   # optional cloud analyst behind the privacy gateway

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
